services:
  kafka:
    image: apache/kafka:latest
    container_name: aikyam-kafka
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Containers must discover Kafka as kafka:9092, while host tools use localhost:9092.
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aikyam-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

  vision-api:
    build:
      context: .
      args:
        INSTALL_CLIP: "true"
        INSTALL_WHISPER: "false"
    ports:
      - "8010:8000"
    environment:
      MODE: api
      SIMCLUSTERS_BASE_URL: ${SIMCLUSTERS_BASE_URL:-http://host.docker.internal:8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      AIKYAM_QDRANT_URL: ${AIKYAM_QDRANT_URL:-http://localhost:6333}
      AIKYAM_CLIP_MODEL_ENABLED: ${AIKYAM_CLIP_MODEL_ENABLED:-true}
      AIKYAM_CLIP_SCORE_THRESHOLD: ${AIKYAM_CLIP_SCORE_THRESHOLD:-0.005}
      AIKYAM_CLIP_TOP_K: ${AIKYAM_CLIP_TOP_K:-10}
      AIKYAM_WHISPER_MODEL_ENABLED: ${AIKYAM_WHISPER_MODEL_ENABLED:-false}
      AIKYAM_WHISPER_MODEL_SIZE: ${AIKYAM_WHISPER_MODEL_SIZE:-base}
    depends_on:
      - kafka

  vision-worker:
    build:
      context: .
      args:
        INSTALL_CLIP: "true"
        INSTALL_WHISPER: "false"
    environment:
      MODE: worker
      SIMCLUSTERS_BASE_URL: ${SIMCLUSTERS_BASE_URL:-http://host.docker.internal:8080}
      AIKYAM_CDN_BASE_URL: ${AIKYAM_CDN_BASE_URL:-https://cdn.shriaikyam.com/media}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CONSUMER_BOOTSTRAP_SERVERS: ${KAFKA_CONSUMER_BOOTSTRAP_SERVERS:-localhost:9092}
      KAFKA_PRODUCER_BOOTSTRAP_SERVERS: ${KAFKA_PRODUCER_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-aikyam-vision-v1}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      POST_CREATED_TOPIC: ${POST_CREATED_TOPIC:-social.post.created}
      VISION_SCORES_TOPIC: ${VISION_SCORES_TOPIC:-aikyam.vision.scores}
      AIKYAM_CLIP_MODEL_ENABLED: ${AIKYAM_CLIP_MODEL_ENABLED:-true}
      AIKYAM_CLIP_SCORE_THRESHOLD: ${AIKYAM_CLIP_SCORE_THRESHOLD:-0.005}
      AIKYAM_CLIP_TOP_K: ${AIKYAM_CLIP_TOP_K:-10}
      AIKYAM_WHISPER_MODEL_ENABLED: ${AIKYAM_WHISPER_MODEL_ENABLED:-false}
      AIKYAM_WHISPER_MODEL_SIZE: ${AIKYAM_WHISPER_MODEL_SIZE:-base}
    depends_on:
      - kafka

  vision-indexer:
    build:
      context: .
      args:
        INSTALL_CLIP: "false"
        INSTALL_WHISPER: "false"
    environment:
      MODE: indexer
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_PRODUCER_BOOTSTRAP_SERVERS: ${KAFKA_PRODUCER_BOOTSTRAP_SERVERS:-kafka:9092}
      VISION_SCORES_TOPIC: ${VISION_SCORES_TOPIC:-aikyam.vision.scores}
      AIKYAM_QDRANT_URL: ${AIKYAM_QDRANT_URL:-http://localhost:6333}
      AIKYAM_QDRANT_COLLECTION: ${AIKYAM_QDRANT_COLLECTION:-aikyam_vision_media}
    depends_on:
      - kafka
